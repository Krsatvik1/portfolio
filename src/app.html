		%sveltekit.head%
		<script>
  // Google Analytics sets cookies, so the Keep Working download page goes without it (Vercel Analytics counts it).
  if (!location.pathname.startsWith('/get-keep-working')) {
    var ga = document.createElement('script');
    ga.async = true;
    ga.src = 'https://www.googletagmanager.com/gtag/js?id=G-DDSE78JR6C';
    document.head.appendChild(ga);
    window.dataLayer = window.dataLayer || [];
    window.gtag = function(){dataLayer.push(arguments);};
    gtag('js', new Date());
    gtag('config', 'G-DDSE78JR6C');
  }
</script>
	</head>
	<body data-sveltekit-preload-data="hover" class="relative">
		<div style="display: contents" class="relative">%sveltekit.body%</div>
	</body>
</html>
